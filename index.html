<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APNG 提取工具</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>APNG 提取工具</h1>
<p class="sub">提取 APNG 中的静态帧（封面）与全部动画帧，差分帧以透明背景 PNG 输出。</p>

<div class="dropzone" id="drop">点击选择或拖入 .png / APNG 文件</div>
<input type="file" id="file" accept=".png,image/png,image/apng" class="hidden">
<div class="error" id="error"></div>
<div class="lightbox hidden" id="lightbox">
  <canvas id="zoom"></canvas>
  <div class="caption" id="caption"></div>
</div>

<div class="panel hidden" id="result">
  <div class="meta" id="meta"></div>

  <h2>静态帧（封面）</h2>
  <div class="toolbar">
    <button id="dl-idat">下载此帧 PNG</button>
  </div>
  <canvas id="cover"></canvas>

  <h2 class="section">动画帧</h2>
  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="mode" checked> 差分模式（透明背景，未合成）</label>
    <button class="secondary" id="dl-all">下载全部（.zip）</button>
  </div>
  <div class="frames" id="frames"></div>
</div>

<script src="js/jszip.js"></script>
<script src="js/app.js"></script>
</body>
</html>
